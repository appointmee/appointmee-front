<ds-modal
  [open]="abierto()"
  (close)="solicitarCierre()"
  ariaLabelledby="modificar-sucursal-titulo"
  maxWidth="560px"
  style="--ds-modal-offset-y: min(var(--space-6), 4dvh); --ds-modal-padding: var(--space-3); --sucursal-form-section-padding: var(--space-4); --sucursal-form-gap: var(--space-4)"
>
  <h2 id="modificar-sucursal-titulo">Modificar sucursal</h2>

  <app-sucursal-form
    idPrefijo="sucursal-editar"
    modo="modificar"
    [fotoRequerida]="false"
    [confirmarDescarte]="true"
    [valoresIniciales]="valoresFormulario()"
    [fotoVigente]="fotoVigente()"
    [errores]="erroresCampos()"
    [errorGeneral]="errorGeneral()"
    [enviando]="guardando()"
    [textoEnviar]="'Modificar sucursal'"
    [textoGuardando]="'Guardando…'"
    (enviar)="onEnviar($event)"
    (cancelar)="cerrarFormulario()"
  >
    <button type="button" class="boton boton--ghost" accionCancelar (click)="solicitarCierre()">
      Cancelar
    </button>
  </app-sucursal-form>
</ds-modal>
