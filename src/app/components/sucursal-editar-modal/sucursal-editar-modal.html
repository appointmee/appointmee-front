<ds-modal
  [open]="abierto()"
  (close)="solicitarCierre()"
  ariaLabelledby="modificar-sucursal-titulo"
  maxWidth="560px"
  style="--ds-modal-offset-y: min(var(--space-6), 4dvh); --ds-modal-max-height: 81dvh; --ds-modal-padding: var(--space-3); --sucursal-form-section-padding: var(--space-4); --sucursal-form-gap: var(--space-4)"
>
  <header class="sucursal-editar-modal__encabezado">
    <h2 id="modificar-sucursal-titulo">Modificar sucursal</h2>
    <button dsButton class="sucursal-editar-modal__cerrar" type="button"
      aria-label="Cerrar edición de sucursal" title="Cerrar"
      (click)="solicitarCierre()">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.8" stroke-linecap="round">
        <path d="m6 6 12 12M18 6 6 18" />
      </svg>
    </button>
  </header>

  <app-sucursal-form
    idPrefijo="sucursal-editar"
    modo="modificar"
    [fotoRequerida]="false"
    [confirmarDescarte]="true"
    [valoresIniciales]="valoresFormulario()"
    [fotoVigente]="fotoVigente()"
    [errores]="erroresCampos()"
    [errorGeneral]="errorGeneral()"
    [enviando]="guardando()"
    [textoEnviar]="'Modificar sucursal'"
    [textoGuardando]="'Guardando…'"
    (enviar)="onEnviar($event)"
    (cancelar)="cerrarFormulario()"
  >
    <button type="button" class="boton boton--ghost" accionCancelar (click)="solicitarCierre()">
      Cancelar
    </button>
  </app-sucursal-form>
</ds-modal>
