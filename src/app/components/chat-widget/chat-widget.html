@if (puedeChatear()) {
  <div class="chat-widget">
    @if (widget.abierto()) {
      <section
        class="chat-widget__panel"
        id="chat-widget-panel"
        role="dialog"
        aria-label="Mensajes"
      >
        <header class="chat-widget__header">
          <h2>Mensajes</h2>
          <button
            #cerrarBoton
            dsButton
            class="chat-widget__cerrar"
            type="button"
            aria-label="Cerrar mensajes"
            (click)="cerrar()"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path [attr.d]="iconoCerrar" />
            </svg>
          </button>
        </header>
        <div class="chat-widget__body">
          <app-chat />
        </div>
      </section>
    }

    @if (abejaVisible()) {
      <div class="abeja" (animationend)="onFinAbeja($event)" aria-hidden="true">
        <span class="abeja__bzz">bzz bzz</span>
        <svg class="abeja__cuerpo" viewBox="0 0 64 64">
          <g class="abeja__alas" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5">
            <ellipse cx="22" cy="19" rx="11" ry="7" transform="rotate(-35 22 19)" />
            <ellipse cx="42" cy="19" rx="11" ry="7" transform="rotate(35 42 19)" />
          </g>
          <ellipse cx="32" cy="37" rx="15" ry="18" fill="var(--accent)" />
          <rect x="20" y="31" width="24" height="5" rx="2.5" fill="var(--on-accent)" />
          <rect x="21" y="41" width="22" height="5" rx="2.5" fill="var(--on-accent)" />
          <circle cx="32" cy="18" r="8" fill="var(--on-accent)" />
          <circle cx="29" cy="17" r="1.6" fill="var(--surface)" />
          <circle cx="35" cy="17" r="1.6" fill="var(--surface)" />
          <path
            d="M28 11l-3-6M36 11l3-6"
            stroke="var(--on-accent)"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </div>
    }

    <button
      #burbuja
      dsButton
      class="chat-widget__burbuja"
      type="button"
      [attr.aria-label]="etiquetaBurbuja()"
      [attr.aria-expanded]="widget.abierto()"
      [attr.aria-controls]="widget.abierto() ? 'chat-widget-panel' : null"
      (click)="toggle()"
    >
      <svg class="chat-widget__logo" viewBox="0 0 48 48" aria-hidden="true">
        <path
          d="M6 21a15 15 0 0 1 15-15h6a15 15 0 0 1 15 15v5a15 15 0 0 1-15 15H17l-9 7v-10a15 15 0 0 1-2-7v-5Z"
          fill="none"
          stroke="currentColor"
          stroke-linejoin="round"
          stroke-width="2.5"
        />
        <ellipse cx="17" cy="14" rx="6" ry="3.5" transform="rotate(-35 17 14)" fill="var(--surface)" stroke="currentColor" stroke-width="1.5" />
        <ellipse cx="31" cy="14" rx="6" ry="3.5" transform="rotate(35 31 14)" fill="var(--surface)" stroke="currentColor" stroke-width="1.5" />
        <ellipse cx="24" cy="25" rx="9" ry="11" fill="currentColor" />
        <path d="M16 23h16M16 29h16" stroke="var(--accent)" stroke-linecap="round" stroke-width="3" />
        <circle cx="24" cy="14" r="5" fill="currentColor" />
        <path d="M21 10l-2-3M27 10l2-3" stroke="currentColor" stroke-linecap="round" stroke-width="1.8" />
      </svg>
    </button>
  </div>
}
