@if (puedeChatear()) {
  <div class="chat-widget">
    @if (widget.abierto()) {
      <section
        class="chat-widget__panel"
        id="chat-widget-panel"
        role="dialog"
        aria-label="Mensajes"
      >
        <header class="chat-widget__header">
          <h2>Mensajes</h2>
          <button
            #cerrarBoton
            dsButton
            class="chat-widget__cerrar"
            type="button"
            aria-label="Cerrar mensajes"
            (click)="cerrar()"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path [attr.d]="iconoCerrar" />
            </svg>
          </button>
        </header>
        <div class="chat-widget__body">
          <app-chat />
        </div>
      </section>
    }

    <div
      class="chat-widget__peek-wrap"
      [attr.aria-hidden]="!expandido()"
      [attr.inert]="!expandido() ? '' : null"
    >
      <span class="chat-widget__peek-abeja" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <ellipse cx="22" cy="19" rx="11" ry="7" transform="rotate(-35 22 19)" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5" />
          <ellipse cx="42" cy="19" rx="11" ry="7" transform="rotate(35 42 19)" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5" />
          <ellipse cx="32" cy="37" rx="15" ry="18" fill="var(--accent)" />
          <rect x="20" y="31" width="24" height="5" rx="2.5" fill="var(--on-accent)" />
          <rect x="21" y="41" width="22" height="5" rx="2.5" fill="var(--on-accent)" />
          <circle cx="32" cy="18" r="8" fill="var(--on-accent)" />
          <circle cx="29" cy="17" r="1.6" fill="var(--surface)" />
          <circle cx="35" cy="17" r="1.6" fill="var(--surface)" />
          <path d="M28 11l-3-6M36 11l3-6" stroke="var(--on-accent)" stroke-linecap="round" stroke-width="2" />
        </svg>
      </span>
      <button
        dsButton
        type="button"
        class="chat-widget__peek"
        (click)="toggle()"
        aria-label="Abrir mensajes"
      >
        Mensajes
      </button>
    </div>

    @if (abejaVisible()) {
      <div class="abeja" (animationend)="onFinAbeja($event)" aria-hidden="true">
        <span class="abeja__bzz">bzz bzz</span>
        <svg class="abeja__cuerpo" viewBox="0 0 64 64">
          <g class="abeja__alas" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5">
            <ellipse cx="22" cy="19" rx="11" ry="7" transform="rotate(-35 22 19)" />
            <ellipse cx="42" cy="19" rx="11" ry="7" transform="rotate(35 42 19)" />
          </g>
          <ellipse cx="32" cy="37" rx="15" ry="18" fill="var(--accent)" />
          <rect x="20" y="31" width="24" height="5" rx="2.5" fill="var(--on-accent)" />
          <rect x="21" y="41" width="22" height="5" rx="2.5" fill="var(--on-accent)" />
          <circle cx="32" cy="18" r="8" fill="var(--on-accent)" />
          <circle cx="29" cy="17" r="1.6" fill="var(--surface)" />
          <circle cx="35" cy="17" r="1.6" fill="var(--surface)" />
          <path
            d="M28 11l-3-6M36 11l3-6"
            stroke="var(--on-accent)"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </div>
    }

    <button
      #burbuja
      dsButton
      class="chat-widget__burbuja"
      type="button"
      [attr.aria-label]="etiquetaBurbuja()"
      [attr.aria-expanded]="widget.abierto()"
      [attr.aria-controls]="widget.abierto() ? 'chat-widget-panel' : null"
      (mouseenter)="onBurbujaEnter()"
      (mouseleave)="onBurbujaLeave()"
      (focus)="onBurbujaEnter()"
      (blur)="onBurbujaLeave()"
      (pointerdown)="onBurbujaDown()"
      (pointerup)="onBurbujaUp()"
      (pointercancel)="onBurbujaLeave()"
      (click)="toggle()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path [attr.d]="iconoMensaje" />
      </svg>
    </button>
  </div>
}
