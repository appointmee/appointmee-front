<a class="skip-link" href="#contenido">Saltar al contenido</a>

<app-navbar />

@if (apiErrors.notice(); as notice) {
  <aside class="api-notice" role="alert">
    <p>{{ notice.error.message }}</p>
    @if (notice.error.status === 403 || notice.error.status === 404) {
      <a routerLink="/">Ir al inicio</a>
    }
    <button type="button" aria-label="Cerrar aviso" (click)="apiErrors.dismiss()">Cerrar</button>
  </aside>
}

@if (rutaFallida()) {
  <aside class="api-notice" role="alert" aria-live="assertive">
    <p>No pudimos abrir la página. Revisá tu conexión e intentá de nuevo.</p>
    <button type="button" [disabled]="reintentando()" (click)="reintentarNavegacion()">
      {{ reintentando() ? 'Reintentando…' : 'Reintentar' }}
    </button>
  </aside>
}

<main class="app-main" id="contenido" tabindex="-1">
  <router-outlet />
</main>
<app-footer />
