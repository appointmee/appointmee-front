<section class="pagina" aria-labelledby="empleados-titulo">
  <div class="pagina__inner">
    <a class="volver-gestor" [routerLink]="['/mis-sucursales']" [queryParams]="{ sucursalId: sucursalId }">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 12H5M11 18l-6-6 6-6" />
      </svg>
      Volver al gestor
    </a>

    <header class="pagina__header">
      <span class="eyebrow">Empleados</span>
      <h1 id="empleados-titulo">Atender servicios en tu sucursal</h1>
      <p>Agregá tu cuenta al equipo para poder atender los servicios de esta sucursal.</p>
    </header>

    <section class="panel" aria-labelledby="auto-incorporacion-titulo">
      <h2 id="auto-incorporacion-titulo" class="sr-only">Auto-incorporación</h2>

      @if (yaEsEmpleado()) {
        <div class="aviso aviso--exito" role="status" aria-live="polite">
          <p>Ya formás parte del equipo de esta sucursal.</p>
        </div>
      } @else {
        @if (errorAgregarme()) {
          <p class="busqueda__error" role="alert">{{ errorAgregarme() }}</p>
        }

        <button
          class="boton boton--principal"
          type="button"
          [disabled]="verificandoEmpleado() || agregandome()"
          (click)="agregarmeComoEmpleado()"
        >
          @if (verificandoEmpleado()) {
            Comprobando…
          } @else if (agregandome()) {
            Agregándote…
          } @else {
            Agregarme como empleado
          }
        </button>
      }
    </section>
  </div>
</section>
