<section class="busqueda">
  <span class="busqueda__eyebrow">AppointMee</span>
  <h1 class="busqueda__titulo">Búsqueda</h1>
  @if (termino()) {
    <p class="busqueda__detalle">Resultados para <strong>“{{ termino() }}”</strong>.</p>
  } @else {
    <p class="busqueda__detalle">Escribí algo en el buscador para empezar.</p>
  }

  <div class="busqueda__card">
    <h2>Resultados en preparación</h2>
    <p>La búsqueda integrada de AppointMee se integra acá muy pronto.</p>
  </div>

  <a class="busqueda__back" routerLink="/">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6" /></svg>
    Volver al inicio
  </a>
</section>
