<section class="login">
  <form class="login__card" (submit)="onSubmit($event)" novalidate
        aria-labelledby="recovery-title" [attr.aria-busy]="cargando()">
    <h1 id="recovery-title" class="login__titulo">Recuperar contraseña</h1>
    <p class="login__sub">Te enviaremos un enlace a tu correo.</p>

    @if (!enviado()) {
      <div class="login__field">
        <label for="recovery-email">Email</label>
        <input id="recovery-email" type="email" autocomplete="email"
               [formField]="recoveryForm.email" [readOnly]="cargando()"
               aria-describedby="recovery-error" />
        <div id="recovery-error" class="login__validation" aria-live="polite">
          @if (recoveryForm.email().touched()) {
            @for (error of recoveryForm.email().errors(); track error.kind) { <p>{{ error.message }}</p> }
          }
        </div>
      </div>
      <button class="login__submit" type="submit" [disabled]="cargando()">
        {{ cargando() ? 'Enviando…' : 'Enviar enlace de recuperación' }}
      </button>
    }

    <p class="login__sub" aria-live="polite" aria-atomic="true">{{ mensaje() }}</p>
    <a class="login__forgot" routerLink="/login">Volver al login</a>
  </form>
</section>
